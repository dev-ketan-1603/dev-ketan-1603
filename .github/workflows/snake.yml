name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23111111&color_dots=%23ffffff,%23ddd6fe,%23c4b5fd,%238b5cf6,%236d28d9&color_dot_border=%23111111
            dist/github-snake-dark.svg?color_snake=%23c6f135&color_dots=%231e1b4b,%234c1d95,%236d28d9,%23a78bfa,%23ff6bb5&color_dot_border=%23111111

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
